; Sentinel — ESP32-S3 Wi-Fi attack DETECTION sensor
; Lab-only / DEFENSIVE: this firmware sniffs and detects. It never transmits
; 802.11 frames, never deauths, never injects, never attacks.
;
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor   (S3 native USB-CDC: usually /dev/ttyACM0)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Faster flashing for the larger combined (detector + scanner) image. If an
; upload ever fails/CRC-errors at this rate, drop to 460800 (see MERGE_GUIDE.md §5).
upload_speed = 921600

; nRF24 driver for your two-radio scanner (merged in later by you). It is declared
; here so `pio run` can resolve it, but it stays INERT: PlatformIO's library
; dependency finder only COMPILES a lib that is actually #included somewhere, and
; nothing in the detector includes <RF24.h>. So the detector still builds and runs
; byte-for-byte as before — RF24 only starts costing flash/RAM once your merged
; source #includes it. (First `pio run` after this change downloads RF24 — needs net.)
lib_deps =
    nrf24/RF24@^1.6.0

build_flags =
    ; The S3 uses native USB-CDC for the serial console. Without this flag the
    ; USB serial port will not enumerate/behave correctly and output is lost.
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Put the project root on the include path so src/*.cpp can #include "config.h"
    ; (config.h lives at esp32/config.h and is git-ignored).
    -I "${PROJECT_DIR}"
    ; Silence the ESP-IDF/Arduino core log (ESP_LOGx) so its lines never interleave
    ; with our one-JSON-object-per-line console output that the Pi bridge parses.
    -DCORE_DEBUG_LEVEL=0
    ; Default log verbosity consumed by your scanner's log_printf (E/W/I/D). Unused
    ; by the detector, so it is harmless until the scanner source is merged.
    -DDEFAULT_VERBOSITY=3
