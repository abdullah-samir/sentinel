; Sentinel — ESP32-S3 Wi-Fi attack DETECTION sensor
; Lab-only / DEFENSIVE: this firmware sniffs and detects. It never transmits
; 802.11 frames, never deauths, never injects, never attacks.
;
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor   (S3 native USB-CDC: usually /dev/ttyACM0)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

build_flags =
    ; The S3 uses native USB-CDC for the serial console. Without this flag the
    ; USB serial port will not enumerate/behave correctly and output is lost.
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Put the project root on the include path so src/*.cpp can #include "config.h"
    ; (config.h lives at esp32/config.h and is git-ignored).
    -I "${PROJECT_DIR}"
