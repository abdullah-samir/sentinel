# Sentinel workflows — data, not code. Each workflow is an ordered list of
# module names (the list IS the execution order). Compose from any role.
#
# Phase 0 ships only the three template modules. Add more workflows here as
# modules land (e.g. wireless_check once red.wifi_scan + ml.detector_deauth exist).

quick_recon:
  steps: [red.recon_nmap]

capture_only:
  steps: [blue.capture_tshark]

# Passive Wi-Fi reconnaissance. requires_hw => shows unavailable (and is skipped)
# until the RTL8188EUS USB adapter + driver are set up (see deploy/wifi-monitor-setup.sh).
wifi_scan:
  steps: [red.wifi_scan]

# Ingest wireless-attack detections from the ESP32-S3 detector node (serial is
# primary; HTTP if esp_url is set). requires_hw => unavailable/skipped until the
# ESP sensor is connected (see esp32/ firmware + /esp dashboard panel).
esp_monitor:
  steps: [blue.esp_sensor]

full_audit:
  steps: [red.recon_nmap, blue.capture_tshark, ml.detector_template]
