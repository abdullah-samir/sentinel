{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<div class="panel" style="max-width:380px;margin:48px auto">
  <h1 style="text-align:center">Sentinel<span style="color:var(--teal)">.</span> — sign in</h1>
  {% if error %}<div class="banner err">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label class="muted" style="font-size:13px">Username</label>
    <input name="username" autocomplete="username" autofocus style="width:100%;margin:4px 0 12px">
    <label class="muted" style="font-size:13px">Password</label>
    <input name="password" type="password" autocomplete="current-password" style="width:100%;margin:4px 0 16px">
    <button class="btn primary" type="submit" style="width:100%">Sign in</button>
  </form>
  <p class="muted" style="font-size:12px;margin-top:14px;text-align:center">
    Authorized use only. Lab environment.</p>
</div>
{% endblock %}
