{% extends "base.html" %}
{% block title %}Run {{ run_id }}{% endblock %}
{% block content %}
<p style="margin:0 0 10px"><a href="/">&larr; Back to overview</a></p>
<div class="panel">
  <h2 style="margin-bottom:6px">Run report</h2>
  <div class="mono" style="font-size:13px">{{ run_id }}</div>
  <div class="muted" style="font-size:13px;margin-top:4px">
    {{ meta.workflow }} · target {{ meta.target or "—" }} ·
    {{ meta.started_at or "—" }} → {{ meta.finished_at or "—" }}</div>
</div>
<div class="panel" style="padding:0;overflow:hidden">
  <!-- The report is a standalone HTML document; isolate it in an iframe to avoid
       nested-document / CSS-bleed issues. -->
  <iframe src="/run/{{ run_id }}/report" title="Run report"
          style="width:100%;height:78vh;border:0;background:#0E1420"></iframe>
</div>
{% endblock %}
